<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="shopify-api-key" content="366c9739a8a9b640c3f1eddf47bce02f">
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<title>Nagish</title>
<style>
  :root{--bg:#f1f1f1;--card:#fff;--text:#1f1f1f;--muted:#5c5c5c;--border:#dcdcdc;--accent:#1f5fbf;--accent-soft:#eaf1fc;--ok:#0c7a43;--ok-soft:#e6f4ec;--bad:#b42318;--bad-soft:#fdecea;--warn-bg:#fff4e5;--warn:#7a4300}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:24px;margin:0 0 4px;line-height:1.3}
  h2{font-size:21px;margin:0 0 8px;line-height:1.35}
  h3{font-size:17px;margin:0 0 6px}
  p{margin:0 0 12px}
  .muted{color:var(--muted)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
  .top select{width:auto;font-size:14px;padding:6px 8px}
  .card{background:var(--card);border-radius:14px;box-shadow:0 1px 0 rgba(0,0,0,.06),0 0 0 1px var(--border);padding:22px;margin-bottom:16px}
  .progress{display:flex;gap:6px;margin:0 0 16px;list-style:none;padding:0}
  .progress li{flex:1;text-align:center;font-size:13px;color:var(--muted);line-height:1.3}
  .progress li::before{content:"";display:block;height:6px;border-radius:3px;background:#d6d6d6;margin-bottom:6px}
  .progress li.on{color:var(--text);font-weight:600}
  .progress li.on::before{background:var(--accent)}
  .progress li.done::before{background:var(--ok)}
  .badge{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 12px;margin-bottom:10px}
  ol.how{margin:0 0 16px;padding-inline-start:22px}
  ol.how li{margin-bottom:6px}
  .why{background:#f7f7f7;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:15px}
  button,.btn{font:inherit;font-size:16px;border-radius:10px;padding:10px 18px;border:1px solid #8a8a8a;background:#fff;color:var(--text);cursor:pointer;min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  button.primary,.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  button.big{font-size:18px;padding:14px 24px;min-height:56px}
  button.link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:6px 0;min-height:0}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
  .nav .end{display:flex;gap:10px;flex-wrap:wrap}
  .q{margin-bottom:22px}
  .q > label:not(.choice),.q > .label{display:block;font-weight:700;font-size:17px;margin-bottom:4px}
  .hint{font-size:14px;color:var(--muted);margin:0 0 8px}
  .sublabel{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
  input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #8a8a8a;border-radius:10px;background:#fff;color:var(--text)}
  textarea{min-height:100px;resize:vertical}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:600px){.two{grid-template-columns:1fr}}
  .choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;background:#fff}
  .choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .choice input{width:20px;height:20px;margin:3px 0 0;flex:none;accent-color:var(--accent)}
  .choice b{display:block}
  .choice span span{display:block;font-size:14px;color:var(--muted)}
  .row-choices{display:flex;gap:8px;flex-wrap:wrap}
  .row-choices .choice{flex:1 1 140px;margin:0}
  details{border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:16px}
  summary{cursor:pointer;font-weight:600}
  details[open] summary{margin-bottom:12px}
  .preview{border:1px solid var(--border);border-radius:10px;padding:18px;max-height:420px;overflow:auto;background:#fafafa;font-size:15px}
  .preview h2{font-size:17px;margin:16px 0 6px}
  .note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:14px 16px;margin:16px 0;font-size:15px}
  .note b{display:block;margin-bottom:4px}
  .success{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:14px 16px;margin:16px 0;font-weight:600}
  .done-mark{font-weight:700}
  .done-mark.ok{color:var(--ok)}
  .done-mark.no{color:var(--muted)}
  .summary-list{list-style:none;padding:0;margin:0 0 16px}
  .summary-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:12px 0;flex-wrap:wrap}

  /* design step */
  .design{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  @media (max-width:720px){.design{grid-template-columns:1fr}}
  .sticky{position:sticky;top:12px}
  .pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;direction:ltr;border:2px solid var(--border);border-radius:10px;padding:6px;background:#fafafa}
  .pos-grid label{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:14px;text-align:center;padding:4px}
  .pos-grid label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .pos-grid input{position:absolute;opacity:0;width:1px;height:1px}
  .pos-grid label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .swatch{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #999;cursor:pointer;padding:0;min-height:0}
  .swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--text)}
  .color-code{flex-basis:100%;margin-top:6px}
  input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
  .swatches input[type=color]{width:46px;height:40px;border:1px solid #8a8a8a;border-radius:8px;padding:2px;background:#fff;cursor:pointer}
  .mock{position:relative;aspect-ratio:16/11;border:1px solid #bbb;border-radius:10px;overflow:hidden;background:#fff}
  .mock .bar{height:22px;background:#e9e9e9;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:5px;padding:0 8px;direction:ltr}
  .mock .bar i{width:8px;height:8px;border-radius:50%;background:#c4c4c4;display:block}
  .mock .page{padding:14px}
  .mock .line{height:9px;background:#ececec;border-radius:5px;margin-bottom:9px}
  .mock .img{height:70px;width:45%;background:#f1f1f1;border-radius:6px;margin-bottom:10px}
  .mock-btn{position:absolute;border-radius:50%;border:2px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:all .2s}
  .mock-btn svg{width:62%;height:62%}
  .mock-cc{position:absolute;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.18);padding:7px 9px;font-size:10px;line-height:1.35;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
  .mock-cc b{font-size:11px}
  .mock-cc .mb{display:inline-block;border-radius:4px;padding:2px 7px;font-size:9px;border:1px solid}
  .mock-phone{width:46%;margin:12px auto 0;aspect-ratio:9/16}
  .caption{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}
  .status{border-radius:12px;padding:16px;margin:0 0 16px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .status.on{background:var(--ok-soft);color:var(--ok)}
  .status.off{background:var(--bad-soft);color:var(--bad)}
  .status.unknown{background:#f3f3f3;color:var(--muted)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main id="app">
  <div class="top">
    <div>
      <h1 data-t="title"></h1>
      <p class="muted" data-t="subtitle"></p>
    </div>
    <select id="ui-lang" aria-label="שפה / Language">
      <option value="he">עברית</option>
      <option value="en">English</option>
    </select>
  </div>

  <ol class="progress" id="progress">
    <li data-p="1" data-t="p1"></li>
    <li data-p="2" data-t="p2"></li>
    <li data-p="3" data-t="p3"></li>
    <li data-p="4" data-t="p4"></li>
    <li data-p="5" data-t="p5"></li>
  </ol>

  <!-- STEP 1: details + statement -->
  <section class="card step" data-step="1" aria-labelledby="s1-h">
    <span class="badge" data-t="stepOf1"></span>
    <h2 id="s1-h" data-t="s1Title"></h2>
    <p data-t="s1Intro"></p>

    <div class="q" role="radiogroup" aria-labelledby="q-have">
      <span class="label" id="q-have" data-t="qHave"></span>
      <label class="choice"><input type="radio" name="mode" value="gen" checked><span><b data-t="haveNo"></b><span data-t="haveNoText"></span></span></label>
      <label class="choice"><input type="radio" name="mode" value="paste"><span><b data-t="haveYes"></b><span data-t="haveYesText"></span></span></label>
    </div>

    <div id="pane-gen">
      <div class="q">
        <label for="f-name" data-t="qName"></label>
        <input type="text" id="f-name">
      </div>
      <div class="q">
        <label for="f-contact" data-t="qContact"></label>
        <p class="hint" data-t="qContactHint"></p>
        <input type="text" id="f-contact" data-ph="phContact">
      </div>
      <div class="q">
        <span class="label" data-t="qReach"></span>
        <p class="hint" data-t="qReachHint"></p>
        <div class="two">
          <div><label for="f-phone" class="sublabel" data-t="fPhone"></label><input type="tel" id="f-phone" dir="ltr" placeholder="050-0000000"></div>
          <div><label for="f-email" class="sublabel" data-t="fEmail"></label><input type="email" id="f-email" dir="ltr"></div>
        </div>
      </div>
      <div class="q">
        <label for="f-limits" data-t="qLimits"></label>
        <p class="hint" data-t="qLimitsHint"></p>
        <textarea id="f-limits" data-ph="phLimits"></textarea>
      </div>
    </div>

    <div id="pane-paste" hidden>
      <div class="q">
        <label for="f-paste" data-t="pasteLabel"></label>
        <p class="hint" data-t="pasteHint"></p>
        <textarea id="f-paste" style="min-height:280px"></textarea>
      </div>
    </div>

    <details>
      <summary data-t="advanced"></summary>
      <div class="q">
        <label for="f-lang" data-t="fLang"></label>
        <select id="f-lang"><option value="he">עברית</option><option value="en">English</option></select>
      </div>
      <div class="q">
        <label for="f-standard" data-t="fStandard"></label>
        <p class="hint" data-t="fStandardHint"></p>
        <select id="f-standard">
          <option value="il" data-t="stdIl"></option>
          <option value="wcag21">WCAG 2.1 AA</option>
          <option value="wcag22">WCAG 2.2 AA</option>
        </select>
      </div>
      <div class="two">
        <div class="q"><label for="f-title" data-t="fTitle"></label><input type="text" id="f-title"></div>
        <div class="q"><label for="f-date" data-t="fDate"></label><input type="date" id="f-date"></div>
      </div>
    </details>

    <h3 data-t="previewTitle"></h3>
    <p class="hint" data-t="previewHint"></p>
    <div class="preview" id="preview"></div>

    <div class="note"><b data-t="legalTitle"></b><span data-t="legalNote"></span></div>

    <div class="success" id="pub-ok" hidden>
      <span data-t="published"></span>
      <a class="btn" id="view-page" target="_blank" rel="noopener" style="margin-inline-start:10px" data-t="viewPage"></a>
    </div>

    <div class="nav">
      <button type="button" id="copy" data-t="copy"></button>
      <div class="end">
        <button type="button" data-next="2" data-t="later"></button>
        <button type="button" class="primary big" id="publish" data-t="publish"></button>
      </div>
    </div>
  </section>

  <!-- STEP 2: toolbar design -->
  <section class="card step" data-step="2" aria-labelledby="s2-h" hidden>
    <span class="badge" data-t="stepOf2"></span>
    <h2 id="s2-h" data-t="s2Title"></h2>
    <p data-t="s2Intro"></p>
    <div class="design">
      <div>
        <div class="q" role="radiogroup" aria-labelledby="q-pos">
          <span class="label" id="q-pos" data-t="qPos"></span>
          <p class="hint" data-t="qPosHint"></p>
          <div class="pos-grid">
            <label><input type="radio" name="position" value="top-left"><span data-t="posTL"></span></label>
            <label><input type="radio" name="position" value="top-right"><span data-t="posTR"></span></label>
            <label><input type="radio" name="position" value="middle-left"><span data-t="posML"></span></label>
            <label><input type="radio" name="position" value="middle-right"><span data-t="posMR"></span></label>
            <label><input type="radio" name="position" value="bottom-left" checked><span data-t="posBL"></span></label>
            <label><input type="radio" name="position" value="bottom-right"><span data-t="posBR"></span></label>
          </div>
        </div>
        <div class="q">
          <span class="label" data-t="qColor"></span>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="q" role="radiogroup" aria-labelledby="q-size">
          <span class="label" id="q-size" data-t="qSize"></span>
          <div class="row-choices">
            <label class="choice"><input type="radio" name="size" value="small"><span><b data-t="sizeS"></b></span></label>
            <label class="choice"><input type="radio" name="size" value="medium" checked><span><b data-t="sizeM"></b></span></label>
            <label class="choice"><input type="radio" name="size" value="large"><span><b data-t="sizeL"></b></span></label>
          </div>
        </div>
        <div class="q">
          <label for="d-lang" data-t="qLang"></label>
          <p class="hint" data-t="qLangHint"></p>
          <select id="d-lang">
            <option value="auto" data-t="langAuto"></option>
            <option value="he">עברית</option>
            <option value="en">English</option>
          </select>
        </div>
        <details>
          <summary data-t="moreDesign"></summary>
          <div class="q">
            <label for="d-ox" data-t="qOffsetX"></label>
            <input type="range" id="d-ox" min="0" max="100" step="2" value="16">
          </div>
          <div class="q">
            <label for="d-oy" data-t="qOffsetY"></label>
            <input type="range" id="d-oy" min="0" max="200" step="4" value="16">
          </div>
          <label class="choice"><input type="checkbox" id="d-mobile" checked><span><b data-t="qMobile"></b><span data-t="qMobileHint"></span></span></label>
        </details>
      </div>
      <div class="sticky">
        <span class="label" style="font-weight:700;display:block;margin-bottom:6px" data-t="livePreview"></span>
        <div class="mock" id="mock-desktop" aria-hidden="true">
          <div class="bar"><i></i><i></i><i></i></div>
          <div class="page"><div class="line" style="width:60%"></div><div class="img"></div><div class="line"></div><div class="line" style="width:80%"></div><div class="line" style="width:70%"></div></div>
        </div>
        <p class="caption" data-t="computer"></p>
        <div class="mock mock-phone" id="mock-phone" aria-hidden="true">
          <div class="page"><div class="line" style="width:70%"></div><div class="img" style="width:100%;height:60px"></div><div class="line"></div><div class="line" style="width:80%"></div></div>
        </div>
        <p class="caption" data-t="phone"></p>
      </div>
    </div>
    <div class="nav">
      <button type="button" data-next="1" data-t="back"></button>
      <button type="button" class="primary big" data-save="3" data-t="saveNext"></button>
    </div>
  </section>

  <!-- STEP 3: cookie banner -->
  <section class="card step" data-step="3" aria-labelledby="s3-h" hidden>
    <span class="badge" data-t="stepOf3"></span>
    <h2 id="s3-h" data-t="s3Title"></h2>
    <p data-t="s3Intro"></p>
    <div class="why" data-t="s3Why"></div>
    <div class="design">
      <div>
        <div class="q" role="radiogroup" aria-labelledby="q-cc">
          <span class="label" id="q-cc" data-t="qCookies"></span>
          <label class="choice"><input type="radio" name="cc-on" value="yes"><span><b data-t="ccYes"></b><span data-t="ccYesText"></span></span></label>
          <label class="choice"><input type="radio" name="cc-on" value="no" checked><span><b data-t="ccNo"></b><span data-t="ccNoText"></span></span></label>
        </div>
        <div id="cc-opts">
          <div class="q" role="radiogroup" aria-labelledby="q-ccpos">
            <span class="label" id="q-ccpos" data-t="qCcPos"></span>
            <label class="choice"><input type="radio" name="cc-layout" value="bottom" checked><span><b data-t="ccBottom"></b></span></label>
            <label class="choice"><input type="radio" name="cc-layout" value="top"><span><b data-t="ccTop"></b></span></label>
            <label class="choice"><input type="radio" name="cc-layout" value="box-start"><span><b data-t="ccBoxStart"></b></span></label>
            <label class="choice"><input type="radio" name="cc-layout" value="box-end"><span><b data-t="ccBoxEnd"></b></span></label>
          </div>
          <details>
            <summary data-t="ccOwnText"></summary>
            <div class="q"><label for="cc-title" data-t="ccTitle"></label><input type="text" id="cc-title"></div>
            <div class="q"><label for="cc-text" data-t="ccText"></label><textarea id="cc-text"></textarea><p class="hint" data-t="ccTextHint"></p></div>
          </details>
        </div>
      </div>
      <div class="sticky" id="cc-preview-wrap">
        <span class="label" style="font-weight:700;display:block;margin-bottom:6px" data-t="livePreview"></span>
        <div class="mock" id="mock-cc" aria-hidden="true">
          <div class="bar"><i></i><i></i><i></i></div>
          <div class="page"><div class="line" style="width:60%"></div><div class="img"></div><div class="line"></div><div class="line" style="width:80%"></div></div>
        </div>
      </div>
    </div>
    <div class="nav">
      <button type="button" data-next="2" data-t="back"></button>
      <button type="button" class="primary big" data-save="4" data-t="saveNext"></button>
    </div>
  </section>

  <!-- STEP 4: switch on -->
  <section class="card step" data-step="4" aria-labelledby="s4-h" hidden>
    <span class="badge" data-t="stepOf4"></span>
    <h2 id="s4-h" data-t="s4Title"></h2>
    <p data-t="s4Intro"></p>
    <div class="status unknown" id="embed-status" aria-live="polite"><span id="embed-status-text"></span></div>
    <h3 data-t="whatToDo"></h3>
    <ol class="how">
      <li data-t="s4a"></li>
      <li data-t="s4b"></li>
      <li data-t="s4c"></li>
      <li data-t="s4d"></li>
    </ol>
    <div class="nav" style="margin-top:0">
      <button type="button" class="primary big" id="open-editor" data-t="openEditor"></button>
      <button type="button" id="recheck" data-t="recheck"></button>
    </div>
    <div class="nav">
      <button type="button" data-next="3" data-t="back"></button>
      <button type="button" class="primary" data-next="5" data-t="toSummary"></button>
    </div>
  </section>

  <!-- STEP 5: done -->
  <section class="card step" data-step="5" aria-labelledby="s5-h" hidden>
    <h2 id="s5-h" data-t="s5Title"></h2>
    <p data-t="s5Intro"></p>
    <ul class="summary-list">
      <li><span><span class="done-mark" id="m-statement"></span> <span data-t="sum1"></span></span><button type="button" class="link" data-next="1" data-t="change"></button></li>
      <li><span><span class="done-mark ok">✓</span> <span data-t="sum2"></span></span><button type="button" class="link" data-next="2" data-t="change"></button></li>
      <li><span><span class="done-mark" id="m-cookies"></span> <span data-t="sum3"></span></span><button type="button" class="link" data-next="3" data-t="change"></button></li>
      <li><span><span class="done-mark" id="m-embed"></span> <span data-t="sum4"></span></span><button type="button" class="link" data-next="4" data-t="change"></button></li>
    </ul>
    <div class="why" data-t="s5Tip"></div>
    <div class="note"><b data-t="legalTitle"></b><span data-t="legalNote"></span></div>
  </section>

  <p class="muted" style="text-align:center;font-size:14px" data-t="footer"></p>
</main>

<script>
(function () {
  var API = 'shopify:admin/api/2026-07/graphql.json';

    document.documentElement.dir = uiLang === 'he' ? 'rtl' : 'ltr';
    $('ui-lang').value = uiLang;
    document.querySelectorAll('[data-t]').forEach(function (n) { n.textContent = T(n.getAttribute('data-t')); });
    document.querySelectorAll('[data-ph]').forEach(function (n) { n.placeholder = T(n.getAttribute('data-ph')); });
    renderSwatches();
    showStep(state.step, true);
    renderPreview(); renderMocks(); renderStatus();
  }

  function showStep(n, quiet) {
    state.step = n;
    document.querySelectorAll('.step').forEach(function (s) { s.hidden = +s.getAttribute('data-step') !== n; });
    document.querySelectorAll('#progress li').forEach(function (li) {
      var p = +li.getAttribute('data-p');
      li.className = p === n ? 'on' : (p < n ? 'done' : '');
      if (p === n) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current');
    });
    mark('m-statement', !!state.pageUrl); mark('m-cookies', design.cookies.on); mark('m-embed', state.embed === true);
    if (n === 4 && state.embed !== true) checkEmbed();
    if (!quiet) {
      window.scrollTo(0, 0);
      var h = document.querySelector('.step[data-step="' + n + '"] h2');
      if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
    }
  }
  function mark(id, on) { var m = $(id); m.textContent = on ? '✓' : '–'; m.className = 'done-mark ' + (on ? 'ok' : 'no'); }

  /* ---------- statement ---------- */
  function formData() {
    return {
      lang: $('f-lang').value, name: $('f-name').value.trim(), contact: $('f-contact').value.trim(),
      phone: $('f-phone').value.trim(), email: $('f-email').value.trim(), standard: $('f-standard').value,
      limits: $('f-limits').value, date: $('f-date').value, paste: $('f-paste').value, title: $('f-title').value,
      mode: state.mode, step: state.step
    };
  }
  function fillForm(d) {
    ['lang', 'name', 'contact', 'phone', 'email', 'standard', 'limits', 'date', 'title', 'paste'].forEach(function (k) {
      var el = $('f-' + k); if (el && d[k] != null) el.value = d[k];
    });
    if (d.mode) setMode(d.mode);
  }
  function formatDate(iso, lang) {
    var d = iso ? new Date(iso + 'T12:00:00') : new Date();
    try { return d.toLocaleDateString(lang === 'he' ? 'he-IL' : 'en-US', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return iso; }
  }
  function buildStatement(d) {
    var he = d.lang === 'he', L = d.lang, name = esc(d.name || (he ? 'העסק' : 'Our store'));
    var h = [];
    h.push('<div dir="' + (he ? 'rtl' : 'ltr') + '" lang="' + L + '">');
    h.push(he
      ? '<p>ב־' + name + ' אנחנו רוצים שכל אחד ואחת יוכלו לגלוש באתר, למצוא מוצרים ולהזמין בקלות – כולל אנשים עם מוגבלות. השקענו בהנגשת האתר ואנחנו ממשיכים לשפר אותו.</p>'
      : '<p>At ' + name + ' we want everyone, including people with disabilities, to be able to browse our site, find products and order easily. We have invested in making the site accessible and keep improving it.</p>');
    h.push('<h2>' + (he ? 'רמת הנגישות באתר' : 'Accessibility level') + '</h2><p>' + STD[d.standard][L] + '</p>');
    h.push('<h2>' + (he ? 'מה עשינו כדי להנגיש את האתר' : 'What we did') + '</h2><ul>');
    Object.keys(DONE).forEach(function (k) { h.push('<li>' + DONE[k][L] + '</li>'); });
    h.push('</ul>');
    h.push('<p>' + (he ? 'אנחנו ממשיכים לבדוק ולשפר את נגישות האתר כל הזמן.' : 'We keep checking and improving the accessibility of the site.') + '</p>');
    h.push('<h2>' + (he ? 'דפדפנים וטכנולוגיות מסייעות' : 'Browsers and assistive technology') + '</h2><p>' +
      (he ? 'האתר מיועד לעבודה בגרסאות העדכניות של הדפדפנים Chrome, Safari, Firefox ו־Edge, ובנוי כך שיתאים לשימוש עם תוכנות קריאת מסך נפוצות.'
          : 'The site is designed for current versions of Chrome, Safari, Firefox and Edge and for use with common screen readers.') + '</p>');
    var limits = d.limits.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    h.push('<h2>' + (he ? 'מגבלות ידועות' : 'Known limitations') + '</h2>');
    h.push('<p>' + (he ? 'למרות מאמצינו, ייתכן שחלקים מסוימים באתר עדיין אינם נגישים במלואם' : 'Despite our efforts, some parts of the site may not yet be fully accessible') + (limits.length ? ':</p><ul>' + limits.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' : '.</p>'));
    h.push('<p>' + (he ? 'רכיבים של ספקים חיצוניים (כמו עמודי התשלום) נמצאים באחריות הספקים. אם נתקלתם בבעיה – נשמח שתספרו לנו, ונטפל בה בהקדם.' : 'Third-party components (such as payment pages) are the responsibility of their providers. If you run into a problem, please tell us and we will fix it as soon as we can.') + '</p>');
    h.push('<h2>' + (he ? 'פנייה לרכז הנגישות' : 'Contact our accessibility coordinator') + '</h2>');
    h.push('<p>' + (he ? 'נתקלתם בקושי? יש לכם הצעה לשיפור? נשמח לשמוע. כדאי לציין את הקושי, את העמוד שבו נתקלתם בו ואת הדפדפן או תוכנת ההקראה שבהם השתמשתם.' : 'Found a problem or have a suggestion? Please tell us the issue, the page where it happened and the browser or assistive technology you used.') + '</p><ul>');
    if (d.contact) h.push('<li>' + (he ? 'רכז/ת הנגישות: ' : 'Accessibility coordinator: ') + esc(d.contact) + '</li>');
    if (d.phone) h.push('<li>' + (he ? 'טלפון: ' : 'Phone: ') + '<a href="tel:' + esc(d.phone.replace(/[^\d+]/g, '')) + '">' + esc(d.phone) + '</a></li>');
    if (d.email) h.push('<li>' + (he ? 'אימייל: ' : 'Email: ') + '<a href="mailto:' + esc(d.email) + '">' + esc(d.email) + '</a></li>');
    h.push('</ul>');
    h.push('<p><strong>' + (he ? 'הצהרה זו עודכנה לאחרונה: ' : 'This statement was last updated: ') + esc(formatDate(d.date, L)) + '.</strong></p>');
    h.push('</div>');
    return h.join('\n');
  }
  function pastedHtml(text) {
    if (/<\/?(p|h\d|ul|ol|li|div|br|strong)\b/i.test(text)) return text;
    return text.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean)
      .map(function (p) { return '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>'; }).join('\n');
  }
  function currentHtml() { return state.mode === 'paste' ? pastedHtml($('f-paste').value) : buildStatement(formData()); }
  function renderPreview() {
    $('preview').innerHTML = state.mode === 'paste' ? (pastedHtml($('f-paste').value) || '<p class="muted">…</p>') : buildStatement(formData());
  }
  function setMode(m) {
    state.mode = m; setRadio('mode', m);
    $('pane-gen').hidden = m !== 'gen'; $('pane-paste').hidden = m !== 'paste';
    renderPreview();
  }

  async function publish() {
    var btn = $('publish');
    if (state.mode === 'paste' && !$('f-paste').value.trim()) { toast(T('emptyPaste'), true); $('f-paste').focus(); return; }
    btn.disabled = true; btn.textContent = T('saving');
    try {
      var title = $('f-title').value.trim() || ($('f-lang').value === 'he' ? 'הצהרת נגישות' : 'Accessibility statement');
      var page = { title: title, body: currentHtml(), isPublished: true };
      var r;
      if (state.pageId) {
        r = (await gql('mutation($id: ID!, $page: PageUpdateInput!) { pageUpdate(id: $id, page: $page) { page { id handle } userErrors { message } } }', { id: state.pageId, page: page })).pageUpdate;
      } else {
        page.handle = HANDLE;
        r = (await gql('mutation($page: PageCreateInput!) { pageCreate(page: $page) { page { id handle } userErrors { message } } }', { page: page })).pageCreate;
      }
      if (r.userErrors && r.userErrors.length) throw new Error(r.userErrors.map(function (e) { return e.message; }).join('; '));
      state.pageId = r.page.id;
      state.pageUrl = state.shopUrl + '/pages/' + r.page.handle;
      state.step = 2;
      await setMetafields([
        ['statement_url', 'single_line_text_field', '/pages/' + r.page.handle],
        ['statement_form', 'json', JSON.stringify(formData())]
      ]);
      $('view-page').href = state.pageUrl; $('pub-ok').hidden = false;
      toast(T('published').replace('✓ ', ''));
      showStep(2);
    } catch (e) {
      toast(T('error') + e.message, true);
    } finally {
      btn.disabled = false; btn.textContent = T('publish');
    }
  }

  async function copyText() {
    var tmp = document.createElement('div'); tmp.innerHTML = currentHtml();
    var text = tmp.innerText || tmp.textContent;
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([tmp.innerHTML], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);
    } catch (e) {
      try { await navigator.clipboard.writeText(text); } catch (e2) { return; }
    }
    toast(T('copied'));
  }

  /* ---------- design ---------- */
  function renderSwatches() {
    var box = $('swatches'); box.innerHTML = '';
    COLORS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'swatch'; b.style.background = c;
      b.setAttribute('aria-label', c); b.setAttribute('aria-pressed', design.color.toLowerCase() === c ? 'true' : 'false');
      b.addEventListener('click', function () { design.color = c; renderSwatches(); renderMocks(); });
      box.appendChild(b);
    });
    /* any color: native picker + a free hex code field, kept in sync */
    var wrap = document.createElement('div');
    wrap.className = 'color-code';
    wrap.innerHTML = '<label for="d-color-code" class="sublabel">' + esc(T('colorCode')) + '</label>' +
      '<div style="display:flex;gap:8px;align-items:center"><input type="color" id="d-color-picker" aria-label="' + esc(T('customColor')) + '" value="' + esc(full(design.color)) + '">' +
      '<input type="text" id="d-color-code" dir="ltr" maxlength="9" spellcheck="false" autocomplete="off" value="' + esc(design.color) + '" style="max-width:140px;font-family:monospace"></div>' +
      '<p class="hint" id="d-color-hint" style="margin-top:4px">' + esc(T('colorCodeHint')) + '</p>';
    box.appendChild(wrap);
    var picker = wrap.querySelector('#d-color-picker'), code = wrap.querySelector('#d-color-code'), hint = wrap.querySelector('#d-color-hint');
    function unpress() { box.querySelectorAll('.swatch').forEach(function (s) { s.setAttribute('aria-pressed', COLORS.indexOf(design.color.toLowerCase()) > -1 && s.getAttribute('aria-label') === design.color.toLowerCase() ? 'true' : 'false'); }); }
    picker.addEventListener('input', function () { design.color = this.value; code.value = this.value; code.removeAttribute('aria-invalid'); hint.textContent = T('colorCodeHint'); unpress(); renderMocks(); });
    code.addEventListener('input', function () {
      var v = this.value.trim(); if (v && v.charAt(0) !== '#') v = '#' + v;
      if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) {
        design.color = v.toLowerCase(); picker.value = full(design.color);
        code.removeAttribute('aria-invalid'); hint.textContent = T('colorCodeHint'); unpress(); renderMocks();
      } else { code.setAttribute('aria-invalid', 'true'); hint.textContent = T('colorCodeBad'); }
    });
  }
  /* #abc -> #aabbcc, for the native color picker */
  function full(c) { return /^#[0-9a-f]{3}$/i.test(c) ? '#' + c.slice(1).split('').map(function (x) { return x + x; }).join('') : c; }
  function readDesign() {
    design.position = radio('position') || design.position;
    design.size = radio('size') || design.size;
    design.lang = $('d-lang').value;
    design.offsetX = +$('d-ox').value; design.offsetY = +$('d-oy').value;
    design.mobile = $('d-mobile').checked;
    design.cookies.on = radio('cc-on') === 'yes';
    design.cookies.layout = radio('cc-layout') || 'bottom';
    design.cookies.title = $('cc-title').value.trim();
    design.cookies.text = $('cc-text').value.trim();
  }
  function fillDesign() {
    setRadio('position', design.position); setRadio('size', design.size);
    $('d-lang').value = design.lang; $('d-ox').value = design.offsetX; $('d-oy').value = design.offsetY;
    $('d-mobile').checked = design.mobile !== false;
    setRadio('cc-on', design.cookies.on ? 'yes' : 'no'); setRadio('cc-layout', design.cookies.layout || 'bottom');
    $('cc-title').value = design.cookies.title || ''; $('cc-text').value = design.cookies.text || '';
    renderSwatches();
  }
  function placeButton(mock, scale, mobile) {
    var old = mock.querySelector('.mock-btn'); if (old) old.remove();
    if (mobile && design.mobile === false) return;
    var px = { small: 42, medium: 52, large: 62 }[design.size] * scale;
    var b = document.createElement('div');
    b.className = 'mock-btn'; b.innerHTML = ICON;
    b.style.width = b.style.height = px + 'px';
    b.style.background = design.color;
    var ox = Math.max(4, design.offsetX * scale) + 'px', oy = Math.max(4, design.offsetY * scale) + 'px';
    var p = design.position.split('-');
    b.style[p[1]] = ox;
    if (p[0] === 'middle') { b.style.top = '50%'; b.style.transform = 'translateY(-50%)'; }
    else b.style[p[0]] = p[0] === 'top' ? 'calc(' + oy + ' + ' + (mobile ? 0 : 22) + 'px)' : oy;
    mock.appendChild(b);
  }
  function renderMocks() {
    placeButton($('mock-desktop'), 0.55, false);
    placeButton($('mock-phone'), 0.45, true);
    var mock = $('mock-cc'), old = mock.querySelector('.mock-cc'); if (old) old.remove();
    $('cc-opts').hidden = !design.cookies.on;
    $('cc-preview-wrap').hidden = !design.cookies.on;
    if (!design.cookies.on) return;
    var c = document.createElement('div'), L = design.cookies.layout, rtl = uiLang === 'he';
    c.className = 'mock-cc'; c.dir = rtl ? 'rtl' : 'ltr';
    var col = design.color;
    c.innerHTML = '<b>' + esc(design.cookies.title || T('ccDefaultTitle')) + '</b><span style="flex-basis:100%">' + esc((design.cookies.text || T('ccDefaultText')).slice(0, 90)) + '</span>' +
      '<span class="mb" style="background:' + col + ';border-color:' + col + ';color:#fff">' + esc(T('ccAll')) + '</span><span class="mb" style="border-color:' + col + '">' + esc(T('ccNone')) + '</span>';
    if (L === 'top') { c.style.cssText += 'left:0;right:0;top:22px;border-bottom:2px solid ' + col; }
    else if (L === 'bottom') { c.style.cssText += 'left:0;right:0;bottom:0;border-top:2px solid ' + col; }
    else {
      c.style.cssText += 'bottom:8px;width:52%;border-radius:8px;border:2px solid ' + col;
      var startIsRight = rtl; /* "start" side follows the store's reading direction */
      var right = (L === 'box-start') === startIsRight;
      c.style[right ? 'right' : 'left'] = '8px';
    }
    mock.appendChild(c);
  }
  async function saveDesign(next, btn) {
    readDesign();
    btn.disabled = true; var label = btn.textContent; btn.textContent = T('saving');
    try {
      await setMetafields([['design', 'json', JSON.stringify(design)], ['statement_form', 'json', JSON.stringify(Object.assign(formData(), { step: next }))]]);
      toast(T('saved'));
      showStep(next);
    } catch (e) {
      toast(T('error') + e.message, true);
    } finally { btn.disabled = false; btn.textContent = label; }
  }

  /* ---------- is the app embed switched on in the live theme? ---------- */
  async function checkEmbed() {
    state.embed = 'checking'; renderStatus();
    try {
      var d = await gql('{ themes(first: 1, roles: [MAIN]) { nodes { files(filenames: ["config/settings_data.json"], first: 1) { nodes { body { ... on OnlineStoreThemeFileBodyText { content } } } } } } }');
      var content = d.themes.nodes[0].files.nodes[0].body.content.replace(/^\s*\/\*[\s\S]*?\*\//, '');
      var data = JSON.parse(content);
      var cur = typeof data.current === 'string' ? (data.presets || {})[data.current] : data.current;
      var blocks = (cur && cur.blocks) || {};
      state.embed = Object.keys(blocks).some(function (k) {
        var b = blocks[k];
        return /nagish/i.test(b.type || '') && /\/blocks\/accessibility\//.test(b.type || '') && !b.disabled;
      });
    } catch (e) { state.embed = null; }
    renderStatus(); mark('m-embed', state.embed === true);
  }
  function renderStatus() {
    var box = $('embed-status'), t = $('embed-status-text');
    var s = state.embed;
    box.className = 'status ' + (s === true ? 'on' : s === false ? 'off' : 'unknown');
    t.textContent = s === true ? T('stOn') : s === false ? T('stOff') : s === 'checking' ? T('stChecking') : T('stUnknown');
  }
  function openEditor() {
    var key = document.querySelector('meta[name="shopify-api-key"]').content;
    window.open('shopify://admin/themes/current/editor?context=apps&activateAppId=' + key + '/accessibility', '_top');
  }

  /* ---------- load ---------- */
  async function load() {
    var d = await gql('{ shop { name email primaryDomain { url } } shopLocales { locale primary } currentAppInstallation { id form: metafield(namespace: "nagish", key: "statement_form") { value } design: metafield(namespace: "nagish", key: "design") { value } } pages(first: 1, query: "handle:' + HANDLE + '") { nodes { id handle } } }');
    state.installationId = d.currentAppInstallation.id;
    state.shopUrl = d.shop.primaryDomain.url;
    var primary = (d.shopLocales.filter(function (l) { return l.primary; })[0] || {}).locale || '';
    var storeLang = /^he/i.test(primary) ? 'he' : 'en';
    if (!uiChosen) uiLang = /^he/i.test(params.get('locale') || '') ? 'he' : storeLang;
    var saved = null;
    try { saved = JSON.parse(d.currentAppInstallation.form && d.currentAppInstallation.form.value); } catch (e) {}
    try { var sd = JSON.parse(d.currentAppInstallation.design && d.currentAppInstallation.design.value); if (sd) { design = Object.assign(design, sd); design.cookies = Object.assign({ on: false, layout: 'bottom' }, sd.cookies || {}); } } catch (e) {}
    if (saved) fillForm(saved);
    else {
      $('f-name').value = d.shop.name; $('f-email').value = d.shop.email || '';
      $('f-lang').value = storeLang;
      $('f-standard').value = storeLang === 'he' ? 'il' : 'wcag21';
      $('f-title').value = storeLang === 'he' ? 'הצהרת נגישות' : 'Accessibility statement';
    }
    var page = d.pages.nodes[0];
    if (page) {
      state.pageId = page.id; state.pageUrl = state.shopUrl + '/pages/' + page.handle;
      $('view-page').href = state.pageUrl; $('pub-ok').hidden = false;
    }
    state.step = saved && saved.step ? saved.step : 1;
    fillDesign();
    renderUI();
    checkEmbed();
  }

  /* ---------- events ---------- */
  $('ui-lang').addEventListener('change', function () { uiLang = this.value; uiChosen = true; renderUI(); });
  $('app').addEventListener('input', function (e) {
    if (e.target.closest('[data-step="1"]')) renderPreview(); else { readDesign(); renderMocks(); }
  });
  $('app').addEventListener('change', function (e) {
    if (e.target.name === 'mode') setMode(e.target.value);
    if (!e.target.closest('[data-step="1"]')) { readDesign(); renderMocks(); }
  });
  document.querySelectorAll('[data-next]').forEach(function (b) {
    b.addEventListener('click', function () {
      showStep(+b.getAttribute('data-next'));
      if (state.installationId) setMetafields([['statement_form', 'json', JSON.stringify(formData())]]).catch(function () {});
    });
  });
  document.querySelectorAll('[data-save]').forEach(function (b) { b.addEventListener('click', function () { saveDesign(+b.getAttribute('data-save'), b); }); });
  $('publish').addEventListener('click', publish);
  $('copy').addEventListener('click', copyText);
  $('open-editor').addEventListener('click', openEditor);
  $('recheck').addEventListener('click', checkEmbed);

  $('f-date').value = new Date().toISOString().slice(0, 10);
  fillDesign();
  renderUI();
  load().catch(function (e) { if (window.shopify && shopify.config && shopify.config.shop) toast(T('error') + e.message, true); });
})();
</script>
</body>
</html>
